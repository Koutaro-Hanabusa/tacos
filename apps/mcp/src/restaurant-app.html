<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tacos restaurant map</title>
    <link rel="stylesheet" href="./restaurant-app.css" />
  </head>
  <body class="m-0 min-w-0 bg-taco-paper text-taco-ink">
    <main
      class="grid h-[40rem] min-w-0 grid-rows-[minmax(18rem,1fr)_22rem] overflow-hidden bg-taco-paper md:grid-cols-[minmax(18rem,0.82fr)_minmax(0,1.6fr)] md:grid-rows-1"
    >
      <aside
        class="flex min-h-0 flex-col border-b border-taco-border/60 bg-taco-surface md:border-r md:border-b-0"
      >
        <header class="border-b border-taco-border/60 px-5 py-5">
          <p
            class="m-0 font-mono text-[0.66rem] font-bold tracking-[0.2em] text-taco-roja-strong uppercase"
          >
            Taco index / result
          </p>
          <div class="mt-2 flex items-end justify-between gap-4">
            <div>
              <h1 class="m-0 font-display text-3xl leading-none font-bold tracking-[-0.055em]">
                検索結果
              </h1>
              <p class="mt-3 mb-0 text-xs leading-relaxed text-taco-muted">
                見つかった店を、地図と一緒に眺められます。
              </p>
            </div>
            <span
              id="count"
              class="border border-taco-lime/60 bg-taco-lime px-2 py-1 font-mono text-xs font-bold text-taco-ink"
              aria-live="polite"
            >
              —
            </span>
          </div>
        </header>

        <div
          id="places"
          class="min-h-0 flex-1 space-y-2 overflow-y-auto p-3"
          aria-label="検索結果のレストラン"
        >
          <p
            id="empty"
            class="m-0 grid min-h-52 place-items-center border border-dashed border-taco-border/70 px-7 text-center font-display text-xl font-bold"
          >
            検索結果を待っています。
          </p>
        </div>
        <p id="status" class="sr-only" role="status">接続しています…</p>
      </aside>

      <section
        id="viewer"
        class="relative min-h-[22rem] min-w-0 overflow-hidden bg-taco-paper-bright"
        aria-label="検索結果のレストラン地図"
      >
        <div class="taco-spectrum pointer-events-none absolute inset-x-0 top-0 z-10 h-1"></div>
        <div
          id="map"
          class="taco-map absolute inset-0 size-full"
          role="region"
          aria-label="レストラン地図"
        ></div>
        <p
          id="map-unavailable"
          class="absolute inset-0 m-0 grid place-items-center px-8 text-center text-sm leading-relaxed text-taco-muted"
          hidden
        >
          地図を表示できません。
        </p>
      </section>
    </main>
    <script type="module" src="./restaurant-app-client.js"></script>
  </body>
</html>
